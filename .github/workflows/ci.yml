name: ci

on:
  push:
    branches:
      - main
      - develop
      - 'codex/**'
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/api

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: talabix_test
          MYSQL_USER: talabix
          MYSQL_PASSWORD: secret
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          extensions: bcmath, intl, pcntl, pdo_mysql, redis, sockets

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Guard PHPStan baseline
        working-directory: .
        run: node scripts/check-phpstan-baseline.mjs

      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env
      - run: php artisan key:generate --force
      - run: php artisan migrate --seed --force
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: talabix_test
          DB_USERNAME: talabix
          DB_PASSWORD: secret
          CACHE_STORE: redis
          QUEUE_CONNECTION: redis
          REDIS_HOST: 127.0.0.1
      - run: vendor/bin/pint --test
      - run: vendor/bin/phpstan analyse --memory-limit=1G
      - run: php artisan test
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: talabix_test
          DB_USERNAME: talabix
          DB_PASSWORD: secret
          CACHE_STORE: redis
          QUEUE_CONNECTION: redis
          REDIS_HOST: 127.0.0.1

  clients:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run lint
      - run: npm run i18n:audit
      - run: npm run test
      - name: Portal admin shell browser smoke
        id: portal_admin_shell_e2e
        run: npm --workspace @talabix/portal-web run test:e2e:admin
      - name: Upload portal admin shell e2e artifacts
        if: failure() && steps.portal_admin_shell_e2e.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: portal-admin-shell-e2e-artifacts
          path: |
            apps/portal-web/test-results/
            apps/portal-web/playwright-report/
          if-no-files-found: ignore
          retention-days: 14
      - name: Customer app browser e2e
        id: customer_e2e
        run: npm --workspace @talabix/customer-app run test:e2e
      - name: Publish customer visual diff ratios
        if: always() && steps.customer_e2e.outcome != 'skipped'
        shell: bash
        run: |
          ratios="apps/customer-app/test-results/visual-diff-ratios.jsonl"
          if [[ ! -f "$ratios" ]]; then
            echo "No customer visual diff ratios were produced." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo "### Customer app visual diff ratios"
            echo
            echo "| Flow | Diff ratio | Threshold |"
            echo "| --- | ---: | ---: |"
            node -e "const fs=require('node:fs'); const lines=fs.readFileSync(process.argv[1], 'utf8').trim().split(/\r?\n/).filter(Boolean); for (const line of lines) { const result=JSON.parse(line); console.log('| '+result.flow+' | '+Number(result.diffRatio).toFixed(4)+' | '+Number(result.threshold).toFixed(2)+' |'); }" "$ratios"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload customer visual diff ratios
        if: always() && steps.customer_e2e.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: customer-app-visual-diff-ratios
          path: apps/customer-app/test-results/visual-diff-ratios.jsonl
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload customer e2e artifacts
        if: failure() && steps.customer_e2e.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: customer-app-e2e-artifacts
          path: |
            apps/customer-app/test-results/
            apps/customer-app/playwright-report/
          if-no-files-found: ignore
          retention-days: 14
