<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
        background: #fff;
        padding: 16px;
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }
      .swatch {
        border-radius: 10px;
        overflow: hidden;
        width: 90px;
      }
      .chip {
        height: 56px;
      }
      .info {
        padding: 6px 8px;
        background: #fafafa;
        border: 1px solid #ececec;
        border-top: none;
        border-radius: 0 0 8px 8px;
      }
      .name {
        font-size: 10px;
        font-weight: 700;
        color: #333;
        display: block;
      }
      .hex {
        font-size: 10px;
        color: #888;
        font-family: monospace;
      }
    </style>
  </head>
  <body>
    <div class="swatch">
      <div class="chip" style="background: #ffe500"></div>
      <div class="info">
        <span class="name">primary</span><span class="hex">#ffe500</span>
      </div>
    </div>
    <div class="swatch">
      <div class="chip" style="background: #b09200"></div>
      <div class="info">
        <span class="name">primaryDeep</span><span class="hex">#b09200</span>
      </div>
    </div>
    <div class="swatch">
      <div class="chip" style="background: #202124"></div>
      <div class="info">
        <span class="name">ink</span><span class="hex">#202124</span>
      </div>
    </div>
    <div class="swatch">
      <div class="chip" style="background: #62666d"></div>
      <div class="info">
        <span class="name">muted</span><span class="hex">#62666d</span>
      </div>
    </div>
    <div class="swatch">
      <div class="chip" style="background: #8d9198"></div>
      <div class="info">
        <span class="name">subtle</span><span class="hex">#8d9198</span>
      </div>
    </div>
    <div class="swatch">
      <div class="chip" style="background: #ececec"></div>
      <div class="info">
        <span class="name">line</span><span class="hex">#ececec</span>
      </div>
    </div>
    <div class="swatch">
      <div
        class="chip"
        style="background: #f6f6f2; border: 1px solid #ececec"
      ></div>
      <div class="info">
        <span class="name">surfaceSoft</span><span class="hex">#f6f6f2</span>
      </div>
    </div>
    <div class="swatch">
      <div
        class="chip"
        style="background: #fff9cf; border: 1px solid #f2e57a"
      ></div>
      <div class="info">
        <span class="name">surfaceWarm</span><span class="hex">#fff9cf</span>
      </div>
    </div>
    <div class="swatch">
      <div class="chip" style="background: #15945f"></div>
      <div class="info">
        <span class="name">green</span><span class="hex">#15945f</span>
      </div>
    </div>
    <div class="swatch">
      <div class="chip" style="background: #0b8fa3"></div>
      <div class="info">
        <span class="name">teal</span><span class="hex">#0b8fa3</span>
      </div>
    </div>
    <div class="swatch">
      <div class="chip" style="background: #e91e63"></div>
      <div class="info">
        <span class="name">rose</span><span class="hex">#e91e63</span>
      </div>
    </div>
    <div class="swatch">
      <div class="chip" style="background: #f7a51d"></div>
      <div class="info">
        <span class="name">orange</span><span class="hex">#f7a51d</span>
      </div>
    </div>
    <div class="swatch">
      <div class="chip" style="background: #17191c"></div>
      <div class="info">
        <span class="name">dark</span><span class="hex">#17191c</span>
      </div>
    </div>
  </body>
</html>
