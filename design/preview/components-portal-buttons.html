<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        margin: 0;
        font-family: 'Space Grotesk', system-ui, sans-serif;
        background:
          linear-gradient(135deg, rgba(255, 140, 66, 0.08), transparent 36%),
          linear-gradient(180deg, #f6f8fb, #eef3f7 56%, #fff);
        padding: 20px;
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-content: flex-start;
        min-height: 100px;
      }
      button {
        font-family: inherit;
        cursor: pointer;
      }
      .btn-primary {
        min-height: 44px;
        border: 0;
        padding: 0 20px;
        border-radius: 14px;
        color: #112134;
        font-weight: 700;
        background: linear-gradient(135deg, #ffb347 0%, #ff8c42 100%);
        box-shadow: 0 14px 30px rgba(255, 140, 66, 0.22);
        font-size: 15px;
        transition:
          transform 160ms ease,
          box-shadow 160ms ease;
      }
      .btn-primary:hover {
        transform: translateY(-1px);
        box-shadow: 0 18px 34px rgba(255, 140, 66, 0.28);
      }
      .btn-secondary {
        min-height: 44px;
        border: 0;
        padding: 0 18px;
        border-radius: 14px;
        color: #314153;
        font-weight: 700;
        background: rgba(17, 33, 52, 0.08);
        font-size: 15px;
        transition: background 160ms ease;
      }
      .btn-secondary:hover {
        background: rgba(17, 33, 52, 0.13);
      }
      .btn-disabled {
        min-height: 44px;
        border: 0;
        padding: 0 20px;
        border-radius: 14px;
        color: #112134;
        font-weight: 700;
        background: linear-gradient(135deg, #ffb347, #ff8c42);
        font-size: 15px;
        opacity: 0.55;
        cursor: not-allowed;
      }
      .btn-sm {
        min-height: 34px;
        padding: 0 14px;
        border-radius: 10px;
        font-size: 13px;
        font-weight: 700;
        border: 0;
        background: rgba(17, 33, 52, 0.08);
        color: #314153;
      }
    </style>
  </head>
  <body>
    <button class="btn-primary">Accept order</button>
    <button class="btn-secondary">Reject order</button>
    <button class="btn-secondary">Export CSV</button>
    <button class="btn-disabled" disabled>Processing…</button>
    <button class="btn-sm">Last 7 days</button>
    <button class="btn-sm">Last 30 days</button>
  </body>
</html>
