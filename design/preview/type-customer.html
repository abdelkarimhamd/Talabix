<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        margin: 0;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        background: #fff;
        padding: 20px;
        display: grid;
        gap: 10px;
        color: #202124;
      }
      .row {
        display: flex;
        align-items: baseline;
        gap: 14px;
      }
      .meta {
        font-size: 10px;
        color: #8d9198;
        min-width: 120px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        font-weight: 700;
      }
      .eyebrow {
        font-size: 12px;
        font-weight: 900;
        text-transform: uppercase;
        color: #15945f;
        letter-spacing: 0;
      }
    </style>
  </head>
  <body>
    <div class="row">
      <span class="meta">page title / 26px 900</span
      ><span style="font-size: 26px; font-weight: 900; line-height: 1.18"
        >Good morning, Sahar</span
      >
    </div>
    <div class="row">
      <span class="meta">section / 22px 900</span
      ><span style="font-size: 22px; font-weight: 900; line-height: 1.22"
        >Nearby restaurants</span
      >
    </div>
    <div class="row">
      <span class="meta">card title / 19px 900</span
      ><span style="font-size: 19px; font-weight: 900; line-height: 1.2"
        >Talabix Demo Kitchen</span
      >
    </div>
    <div class="row">
      <span class="meta">label / 16px 900</span
      ><span style="font-size: 16px; font-weight: 900"
        >Home · King Fahad Road</span
      >
    </div>
    <div class="row">
      <span class="meta">body / 14px 400</span
      ><span style="font-size: 14px; line-height: 1.45; color: #62666d"
        >Olaya Branch – Olaya Street, Riyadh</span
      >
    </div>
    <div class="row">
      <span class="meta">small / 13px</span
      ><span style="font-size: 13px; line-height: 1.4; color: #8d9198"
        >10 min • Free delivery</span
      >
    </div>
    <div class="row">
      <span class="meta">eyebrow / 12px</span
      ><span class="eyebrow">Live tracking</span>
    </div>
    <div class="row">
      <span class="meta">badge / 11px 900</span
      ><span
        style="
          font-size: 11px;
          font-weight: 900;
          background: #e91e63;
          color: #fff;
          borderradius: 6px;
          padding: 3px 7px;
          border-radius: 6px;
        "
        >Up to 35%</span
      >
    </div>
  </body>
</html>
