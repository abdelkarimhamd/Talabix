    />

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background: #bebebe;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding: 32px 24px;
        font-family:
          'DM Sans',
          -apple-system,
          system-ui,
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .phone {
        width: 390px;
        height: 844px;
        background: #fff;
        border-radius: 50px;
        overflow: hidden;
        box-shadow:
          0 60px 130px rgba(0, 0, 0, 0.38),
          0 0 0 1.5px rgba(0, 0, 0, 0.12);
        display: flex;
        flex-direction: column;
        position: relative;
      }
      .sbar {
        height: 44px;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 24px;
        background: #fff;
        position: relative;
        z-index: 5;
      }
      .body {
        flex: 1;
        overflow-y: auto;
        overflow-x: hidden;
        -webkit-overflow-scrolling: touch;
        background: #fff;
      }
      .body::-webkit-scrollbar {
        display: none;
      }
      .tbar {
        height: 76px;
        flex-shrink: 0;
        background: #fff;
        border-top: 1.5px solid #f0f0f0;
        display: flex;
        justify-content: space-around;
        align-items: center;
        padding: 4px 4px 10px;
      }
      button {
        font-family: inherit;
        cursor: pointer;
      }

      /* tweaks panel */
      #tweaks-panel {
        position: fixed;
        bottom: 24px;
        right: 24px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(16px);
        border: 1px solid rgba(0, 0, 0, 0.1);
        border-radius: 16px;
        padding: 16px;
        min-width: 200px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
        z-index: 1000;
        display: none;
        font-size: 13px;
      }
      #tweaks-panel h4 {
        font-size: 12px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: #888;
        margin-bottom: 12px;
      }
      .tw-row {
        display: flex;
        flex-direction: column;
        gap: 5px;
        margin-bottom: 12px;
      }
      .tw-row label {
        font-size: 12px;
        font-weight: 600;
        color: #444;
      }
      .tw-row select,
      .tw-row input {
        border: 1px solid #e0e0e0;
        border-radius: 8px;
        padding: 6px 10px;
        font-size: 13px;
        font-family: inherit;
        background: #fff;
        color: #1c1c1e;
      }
    </style>
  </head>

          <option value="#1C1C1E">Dark</option>
          <option value="#E8F0FE">Soft blue</option>

      // ── App ─────────────────────────────────────────────────────────────────
      function App() {
        const saved = localStorage.getItem('tx2-tab') || 'home';
        const [tab, setTab] = React.useState(saved);
        const [merchant, setMerchant] = React.useState(null);

        React.useEffect(() => {
          localStorage.setItem('tx2-tab', tab);
        }, [tab]);

        // Tweaks wiring
        React.useEffect(() => {
          const handler = (e) => {
            if (e.type === 'message') {
              if (e.data?.type === '__activate_edit_mode')
                document.getElementById('tweaks-panel').style.display = 'block';
              if (e.data?.type === '__deactivate_edit_mode')
                document.getElementById('tweaks-panel').style.display = 'none';
            }
          };
          window.addEventListener('message', handler);
          window.parent.postMessage({ type: '__edit_mode_available' }, '*');
          // wire selects
          document
            .getElementById('tw-screen')
            .addEventListener('change', (e) => {
              setMerchant(null);
              const v = e.target.value;
              if (v === 'merchant') {
                setMerchant(MERCHANTS[0]);
                setTab('home');
              } else {
                setTab(v);
              }
            });
          document.getElementById('tw-bg').addEventListener('change', (e) => {
            document.body.style.background = e.target.value;
          });
          return () => window.removeEventListener('message', handler);
        }, []);

        const handleTab = (k) => {
          setMerchant(null);
          setTab(k);
        };

        const renderScreen = () => {
          if (merchant)
            return (
              <MerchantScreen
                merchant={merchant}
                onBack={() => setMerchant(null)}
              />
            );
          if (tab === 'home')
            return <HomeScreen onMerchantPress={(m) => setMerchant(m)} />;
          if (tab === 'orders') return <OrdersScreen />;
          if (tab === 'profile') return <ProfileScreen />;
          return (
            <div
              style={{
                display: 'flex',
                flexDirection: 'column',
                alignItems: 'center',
                justifyContent: 'center',
                height: '100%',
                gap: 12,
                color: C.muted,
                padding: 32,
              }}
            >
              <div style={{ fontSize: 48 }}>🚧</div>
              <div style={{ fontSize: 15, fontWeight: 700, color: C.ink }}>
                {tab.charAt(0).toUpperCase() + tab.slice(1)}
              </div>
              <div
                style={{ fontSize: 13, color: C.muted, textAlign: 'center' }}
              >
                This screen is not yet built in this kit.
              </div>
            </div>
          );
        };

        return (
          <div className="phone">
            <StatusBar bg={tab === 'profile' && !merchant ? '#fff' : '#fff'} />
            <div className="body">{renderScreen()}</div>
            <TabBar active={merchant ? 'home' : tab} onTab={handleTab} />
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
