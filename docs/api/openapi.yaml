        - Endpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: 'Must be a valid email address.'
                  example: gbailey@example.net
                token:
                  type: string
                  description: ''
                  example: architecto
                password:
                  type: string
                  description: 'Must be at least 8 characters.'
                  example: ']|{+-0pBNvYg'
              required:
                - email
                - token
                - password
  /api/v1/customer/merchants:
    get:
      summary: ''
      operationId: getApiV1CustomerMerchants
      description: ''
      parameters: []
      responses:
        422:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Please review the required fields.'
                  errors:
                    address_uuid:
                      - 'A signed-in customer is required to filter merchants by address.'
                properties:
                  message:
                    type: string
                    example: 'Please review the required fields.'
                  errors:
                    type: object
