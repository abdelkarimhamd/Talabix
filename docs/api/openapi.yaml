            schema:
              type: object
              properties:
                address_uuid:
                  type: string
                  description: 'Must be a valid UUID.'
                  example: 6ff8f7f6-1eb3-3525-be4a-3932c805afed
                  nullable: true
                search:
                  type: string
                  description: 'Must not be greater than 120 characters.'
                  example: g
                  nullable: true
                open_now:
                  type: boolean
                  description: ''
                  example: true
                  nullable: true
