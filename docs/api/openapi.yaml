openapi: 3.0.3
info:
  title: 'Talabix Delivery Marketplace API'
  description: 'Versioned actor-scoped API for Talabix marketplace clients.'
  version: 1.0.0
servers:
  -
    url: 'http://localhost:8000'
tags:
  -
    name: Endpoints
    description: ''
components:
  securitySchemes:
    default:
      type: http
      scheme: bearer
      description: 'Authenticate with a Sanctum bearer token issued by the actor-specific login endpoints.'
security:
  -
    default: []
paths:
  /api/v1/customer/auth/register:
    post:
      summary: ''
      operationId: postApiV1CustomerAuthRegister
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Endpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'Must not be greater than 120 characters.'
                  example: b
                email:
                  type: string
                  description: 'Must be a valid email address. Must not be greater than 255 characters.'
                  example: zbailey@example.net
                phone:
                  type: string
                  description: 'Must not be greater than 32 characters.'
                  example: i
                password:
                  type: string
                  description: ''
                  example: architecto
                device_name:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: 'n'
              required:
                - name
                - email
                - phone
                - password
                - device_name
  /api/v1/customer/auth/login:
    post:
      summary: ''
      operationId: postApiV1CustomerAuthLogin
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Endpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: 'Must be a valid email address.'
                  example: gbailey@example.net
                password:
                  type: string
                  description: ''
                  example: '|]|{+-'
                device_name:
                  type: string
                  description: 'Must not be greater than 255 characters.'
