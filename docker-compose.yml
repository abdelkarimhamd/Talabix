services:
  api:
    build:
      context: .
      dockerfile: apps/api/docker/php/Dockerfile
    working_dir: /var/www/html/apps/api
    command: php artisan serve --host=0.0.0.0 --port=8000
    env_file:
      - apps/api/.env
    ports:
      - '${API_FORWARD_PORT:-8000}:8000'
    volumes:
      - .:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build:
      context: .
      dockerfile: apps/api/docker/php/Dockerfile
    working_dir: /var/www/html/apps/api
    command: php artisan horizon
    env_file:
      - apps/api/.env
    volumes:
      - .:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  scheduler:
    build:
      context: .
      dockerfile: apps/api/docker/php/Dockerfile
    working_dir: /var/www/html/apps/api
    command: sh /usr/local/bin/start-scheduler.sh
    env_file:
      - apps/api/.env
    volumes:
      - .:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  reverb:
    build:
      context: .
      dockerfile: apps/api/docker/php/Dockerfile
    working_dir: /var/www/html/apps/api
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    env_file:
      - apps/api/.env
    ports:
      - '${REVERB_FORWARD_PORT:-8080}:8080'
    volumes:
      - .:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: talabix
      MYSQL_USER: talabix
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    ports:
      - '${MYSQL_FORWARD_PORT:-33060}:3306'
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-proot']
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '${REDIS_FORWARD_PORT:-6379}:6379'
    volumes:
      - redis-data:/data

  mailpit:
    image: axllent/mailpit:v1.26
    ports:
      - '${MAILPIT_SMTP_FORWARD_PORT:-1025}:1025'
      - '${MAILPIT_UI_FORWARD_PORT:-8025}:8025'

volumes:
  mysql-data:
  redis-data:
